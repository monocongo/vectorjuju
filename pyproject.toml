[project]
name = "vectorjuju"
dynamic = ["version"]
description = "Vectorization pipeline for the masses"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "docling>=2.127.0",
    # ocrmac wraps Apple Vision (macOS only); RapidOCR is docling's
    # Linux/CPU-friendly ONNX engine (docs/research/docling-plat-capabilities.md).
    "docling[ocrmac]>=2.127.0; sys_platform == 'darwin'",
    "docling[rapidocr]>=2.127.0; sys_platform != 'darwin'",
    "ezdxf>=1.4.4",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "scikit-image>=0.26.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "reportlab>=5.0.1",
    "ruff>=0.8,<1",
]

[tool.uv]
# rapidocr (docling's Linux OCR engine) depends on plain opencv-python, which
# installs into the same cv2 namespace as opencv-python-headless above --
# an unsupported coexistence one version bump from `ImportError: libGL.so.1`
# on a headless CI image. Never satisfy it; opencv-python-headless already
# covers every cv2 need this package has.
override-dependencies = ["opencv-python; sys_platform == 'never_matches_a_real_platform'"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/vectorjuju"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["acceptance: OCR path over a generated medium; local only until the CI acceptance job (issue #22)"]
