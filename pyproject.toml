[project]
name = "vectorjuju"
dynamic = ["version"]
description = "Vectorization pipeline for the masses"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "pytest>=9.0.3,<10",
    "reportlab>=5.0.1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/vectorjuju"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
